worker_processes 1;
events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;
    access_log off;

    # Dynamic upstream resolving all replicas of target-app.
    # keepalive plus HTTP/1.1 is what lets the replay hold 800 RPS.
    upstream target_backend {
        least_conn;
        server target-app:8080 max_fails=3 fail_timeout=5s;
        keepalive 64;
    }

    server {
        listen 8090;

        location /stub_status {
            stub_status on;
            access_log off;
            allow all;
        }

        location / {
            proxy_pass http://target_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Pass through the container replica hostname header
            proxy_pass_header X-Served-By;

            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
        }
    }
}
