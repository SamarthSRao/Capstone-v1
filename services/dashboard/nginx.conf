server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Same-origin proxy. The browser asks this pod for /api/orchestrator/...
    # and nginx forwards to the cluster Service. Cluster DNS is not reachable
    # from a laptop, so the page must not call http://orchestrator:8082 itself.
    location /api/orchestrator/ {
        proxy_pass http://orchestrator.capstone.svc.cluster.local:8082/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 10s;
        proxy_connect_timeout 2s;
    }

    location /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
