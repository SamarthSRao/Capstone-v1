# Included from the image's http block, so map is legal here.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Same-origin proxy. nginx-lb forwards the browser to this pod. The page
    # only GETs /api/orchestrator/api/target/status (see Dashboard.jsx).
    # Everything else under this prefix, including POST /scale, is not
    # forwarded. Cluster DNS is not reachable from a laptop, so the bundle
    # must keep the relative VITE_ORCHESTRATOR_URL=/api/orchestrator.
    location = /api/orchestrator/api/target/status {
        limit_except GET {
            deny all;
        }
        proxy_pass http://orchestrator.capstone.svc.cluster.local:8082/api/target/status;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 2s;
    }

    location /api/orchestrator/ {
        default_type text/plain;
        return 404 "not found\n";
    }

    location /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
