version: '3.8'

services:
  # 1. Independent Open-Source Target Web Application (Online Boutique)
  target-app:
    build:
      context: ./services/target-app
    expose:
      - "8080"
    restart: unless-stopped
    networks:
      - capstone-net

  # 2. Dynamic Reverse Proxy & Load Balancer for Target Application
  nginx-lb:
    image: nginx:alpine
    ports:
      - "8090:8090"
    volumes:
      - ./services/target-app/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - target-app
    restart: unless-stopped
    networks:
      - capstone-net

  # 3. HybridTimeNet ML Predictor (Bayesian LSTM + RL Agent)
  predictor:
    build:
      context: ./services/load-predictor
    ports:
      - "50051:50051"
      - "50052:50052"
    restart: unless-stopped
    networks:
      - capstone-net

  # 4. Intelligent Go Orchestrator with Docker Scaling Actuator
  orchestrator:
    build:
      context: ./services/orchestrator
    ports:
      - "8082:8082"
    environment:
      - TARGET_METRICS_URL=http://nginx-lb:8090/stub_status
      - SIMULATOR_URL=http://simulator:8083
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - predictor
      - nginx-lb
    restart: unless-stopped
    networks:
      - capstone-net

  # 5. Live Telemetry & Scaling Control Dashboard
  dashboard:
    build:
      context: ./services/dashboard
    ports:
      - "3000:3000"
    environment:
      - VITE_ORCHESTRATOR_URL=http://localhost:8082
    depends_on:
      - orchestrator
    restart: unless-stopped
    networks:
      - capstone-net

networks:
  capstone-net:
    driver: bridge
