syntax = "proto3";

package predictor;

option go_package = "github.com/samarthsrao/capstone/protos/predictor";

service Predictor {
  rpc GetPrediction (PredictionRequest) returns (PredictionResponse) {}
}

message PredictionRequest {
  repeated float history = 1;
  string timestamp = 2;
  float sla_violation_rate = 3;
  float wasted_capacity = 4;
}

message PredictionResponse {
  float mean = 1;
  float std_dev = 2;
  float upper_bound = 3;
  float lower_bound = 4;
  float z_score = 5;
  int32 rl_action = 6;
  float raw_ml_mean = 7;
  float error_ratio = 8;
  float state_variance_norm = 9;
  float state_sla = 10;
  float state_waste_norm = 11;
  float state_trend = 12;
  float state_hour_sin = 13;
}
