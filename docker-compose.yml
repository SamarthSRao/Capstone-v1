services:
  predictor:
    build:
      context: ./services/load-predictor
    ports:
      - "50051:50051"
    networks:
      - capstone-net

  orchestrator:
    build:
      context: ./services/orchestrator
    ports:
      - "8082:8082"
    environment:
      - SIMULATOR_URL=http://simulator:8083
    depends_on:
      - predictor
    networks:
      - capstone-net

  simulator:
    build:
      context: ./services/simulator
    ports:
      - "8083:8083"
    environment:
      - ORCHESTRATOR_URL=http://orchestrator:8082
    depends_on:
      - orchestrator
    networks:
      - capstone-net

  dashboard:
    build:
      context: ./services/dashboard
    ports:
      - "3000:3000"
    environment:
      - VITE_SIMULATOR_URL=http://localhost:8083
    depends_on:
      - simulator
    networks:
      - capstone-net

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexusgear123
      POSTGRES_DB: nexusgear
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./services/api/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexusgear"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - capstone-net

  api:
    build:
      context: ./services/api
    ports:
      - "8081:8080"
    environment:
      DATABASE_URL: postgres://nexus:nexusgear123@postgres:5432/nexusgear?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure
    networks:
      - capstone-net

  ecommerce:
    build:
      context: ./services/ecommerce
    ports:
      - "5174:5173"
    environment:
      VITE_SIMULATOR_URL: http://localhost:8083
      VITE_API_URL: http://localhost:8081
    depends_on:
      - api
    networks:
      - capstone-net

volumes:
  postgres-data:

networks:
  capstone-net:
    driver: bridge