apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: capstone
  labels:
    app: dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dashboard
  template:
    metadata:
      labels:
        app: dashboard
    spec:
      terminationGracePeriodSeconds: 15
      containers:
        - name: dashboard
          image: capstone/dashboard:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          # Static nginx build. The browser loads this pod through nginx-lb
          # port 80 and calls /api/orchestrator/..., which this pod proxies to
          # the orchestrator Service. VITE_ORCHESTRATOR_URL is the relative
          # path /api/orchestrator, baked at image build. A cluster DNS name
          # would be fetched by the browser and fail.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard
  namespace: capstone
spec:
  type: ClusterIP
  selector:
    app: dashboard
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
