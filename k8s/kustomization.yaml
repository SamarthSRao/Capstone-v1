apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Local kind/minikube images are named capstone/<component>:latest and are
# loaded into the cluster (imagePullPolicy IfNotPresent). AKS rewrites these
# names to <acr>.azurecr.io/<component>:latest via a generated overlay in
# deploy/deploy_aks.sh and deploy/deploy_aks.ps1. The load generator is
# applied separately (k8s/06-loadgen-job.yaml) so a deploy does not start traffic.
resources:
  - 00-namespace.yaml
  - 01-rbac.yaml
  - 02-target-app.yaml
  - 03-predictor.yaml
  - 04-orchestrator.yaml
  - 05-dashboard.yaml
