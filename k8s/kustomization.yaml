apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Local kind/minikube images are named capstone/<component>:latest and are
# loaded into the cluster (imagePullPolicy IfNotPresent). AKS rewrites these
# names to <acr>.azurecr.io/<component>:latest via a generated overlay in
# deploy/deploy_aks.sh and deploy/deploy_aks.ps1. Load generators are
# applied separately (k8s/06-loadgen-job.yaml, k8s/07-nasa-replay-job.yaml)
# so a deploy does not start traffic.
# 08-storefront.yaml is the static NexusGear page (capstone/storefront:latest,
# built from services/ecommerce). The nginx-lb config in 02-target-app.yaml has
# a `storefront` upstream, so it must be deployed with it.
resources:
  - 00-namespace.yaml
  - 01-rbac.yaml
  - 02-target-app.yaml
  - 03-predictor.yaml
  - 04-orchestrator.yaml
  - 05-dashboard.yaml
  - 08-storefront.yaml
