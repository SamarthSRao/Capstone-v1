apiVersion: v1
kind: ServiceAccount
metadata:
  name: orchestrator-sa
  namespace: capstone
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: orchestrator-scaler-role
  namespace: capstone
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: orchestrator-scaler-binding
  namespace: capstone
subjects:
  - kind: ServiceAccount
    name: orchestrator-sa
    namespace: capstone
roleRef:
  kind: Role
  name: orchestrator-scaler-role
  apiGroup: rbac.authorization.k8s.io
