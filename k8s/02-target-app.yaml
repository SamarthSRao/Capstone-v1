apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-lb-config
  namespace: capstone
data:
  nginx.conf: |
    # One worker is enough on a 2 vCPU node. Access logs are off so 800 RPS
    # is not spent formatting lines. Keepalive to the storefront avoids a
    # new upstream TCP handshake per request.
    #
    # One public LoadBalancer IP (Azure for Students allows 3 Standard
    # public IPs, and the cluster outbound IP uses one of them):
    #   :80   dashboard
    #   :8090 storefront (/ , /api/products, /api/checkout, /health, /metrics)
    #   :8091 stub_status, ClusterIP only, private clients
    worker_processes 1;
    events {
        worker_connections 4096;
        multi_accept on;
    }
    http {
        access_log off;
        keepalive_timeout 65;

        map $http_upgrade $connection_upgrade {
            default upgrade;
            ''      close;
        }

        # Real-visitor counting. 1 only for a GET of "/" that asks for HTML
        # and does not carry X-Load-Test. In a mirror subrequest $uri is the
        # mirror location, so the original $request_uri is matched. The
        # orchestrator applies the same rule again (services/orchestrator/
        # visitors.go) and also drops known bots and probes by user agent.
        map "$request_method|$request_uri|$http_x_load_test|$http_accept" $count_visit {
            default 0;
            "~*^GET\|/(\?[^|]*)?\|\|[^|]*text/html" 1;
        }
        upstream orchestrator_visits {
            server orchestrator:8082;
            keepalive 4;
        }

        upstream target_backend {
            least_conn;
            server target-app:8080 max_fails=3 fail_timeout=5s;
            keepalive 64;
        }
        upstream dashboard_backend {
            server dashboard:80;
            keepalive 16;
        }

        server {
            listen 8090;
            # Fire-and-forget copy of every request to /_visit, which drops
            # all but browser page loads of "/". The client never waits for it
            # and a failing orchestrator does not affect the storefront.
            mirror /_visit;
            mirror_request_body off;
            location = /_visit {
                internal;
                if ($count_visit = 0) {
                    return 204;
                }
                # The page's query string (utm_source=...) is not sent on.
                set $args "";
                proxy_pass http://orchestrator_visits/api/target/visit;
                proxy_method POST;
                proxy_http_version 1.1;
                proxy_set_header Connection "";
                proxy_pass_request_body off;
                proxy_set_header Content-Length "";
                # The address nginx-lb saw. Not X-Forwarded-For: that header
                # is client-controlled. Cookies and credentials are not passed.
                proxy_set_header X-Visitor-IP $remote_addr;
                proxy_set_header X-Orig-Method $request_method;
                proxy_set_header X-Orig-URI $request_uri;
                proxy_set_header X-Forwarded-For "";
                proxy_set_header Cookie "";
                proxy_set_header Authorization "";
                proxy_connect_timeout 1s;
                proxy_read_timeout 2s;
            }
            location = /healthz {
                access_log off;
                default_type text/plain;
                return 200 "ok\n";
            }
            location / {
                proxy_pass http://target_backend;
                proxy_http_version 1.1;
                proxy_set_header Connection "";
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_connect_timeout 2s;
                proxy_read_timeout 5s;
            }
        }

        server {
            listen 80;
            # The dashboard polls /api/orchestrator/... and its nginx proxies
            # that prefix on. Forward the whole request, including Upgrade,
            # and do not buffer so a stream is not held until it ends.
            location / {
                proxy_pass http://dashboard_backend;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection $connection_upgrade;
                proxy_buffering off;
                proxy_cache off;
                proxy_read_timeout 3600s;
                proxy_send_timeout 3600s;
            }
        }

        server {
            listen 8091;
            location = /stub_status {
                stub_status on;
                access_log off;
                allow 127.0.0.1;
                allow ::1;
                allow 10.0.0.0/8;
                allow 172.16.0.0/12;
                allow 192.168.0.0/16;
                deny all;
            }
            location / {
                return 404;
            }
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: target-app
  namespace: capstone
  labels:
    app: target-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: target-app
  template:
    metadata:
      labels:
        app: target-app
    spec:
      terminationGracePeriodSeconds: 20
      containers:
        - name: target-app
          image: capstone/target-app:latest
          # IfNotPresent so kind/minikube can use a locally loaded image.
          # The AKS deploy scripts overlay imagePullPolicy: Always after the
          # image has been pushed to ACR.
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          # /health is implemented by services/target-app and is not used for
          # traffic. Readiness keeps a pod out of the Service until it can
          # serve, which is the 10-30s startup the forecast lead time covers.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          resources:
            # 50m request lets a 2-vCPU student node schedule the warm-up
            # fleet (requests, not limits, decide scheduling).
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: target-app
  namespace: capstone
spec:
  selector:
    app: target-app
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-lb
  namespace: capstone
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-lb
  template:
    metadata:
      labels:
        app: nginx-lb
    spec:
      terminationGracePeriodSeconds: 20
      containers:
        - name: nginx-lb
          image: nginx:alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8090
            - name: web
              containerPort: 80
            - name: metrics
              containerPort: 8091
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 15
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          resources:
            # Requests stay small so this schedules beside the storefront on
            # a 2 vCPU node. The limit is one core: proxying the replay peak
            # is mostly that core, not the 50m request.
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 192Mi
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
      volumes:
        - name: nginx-config
          configMap:
            name: nginx-lb-config
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-lb
  namespace: capstone
spec:
  type: LoadBalancer
  # Keep the visitor's real address. With the default (Cluster) the Azure
  # load balancer's traffic is source-NATed by kube-proxy and nginx-lb sees a
  # node or pod address, so every visitor would look like one address.
  externalTrafficPolicy: Local
  selector:
    app: nginx-lb
  ports:
    - name: web
      protocol: TCP
      port: 80
      targetPort: web
    - name: http
      protocol: TCP
      port: 8090
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-metrics
  namespace: capstone
spec:
  type: ClusterIP
  selector:
    app: nginx-lb
  ports:
    - name: metrics
      protocol: TCP
      port: 8091
      targetPort: metrics
