apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-lb-config
  namespace: capstone
data:
  nginx.conf: |
    # One worker is enough on a 2 vCPU node. Access logs are off so 800 RPS
    # is not spent formatting lines. Keepalive to the storefront avoids a
    # new upstream TCP handshake per request.
    #
    # One public LoadBalancer IP (Azure for Students allows 3 Standard
    # public IPs, and the cluster outbound IP uses one of them):
    #   :80   dashboard
    #   :8090 storefront (/ , /api/products, /api/checkout, /health, /metrics)
    #   :8091 stub_status, ClusterIP only, private clients
    worker_processes 1;
    events {
        worker_connections 4096;
        multi_accept on;
    }
    http {
        access_log off;
        keepalive_timeout 65;

        map $http_upgrade $connection_upgrade {
            default upgrade;
            ''      close;
        }

        upstream target_backend {
            least_conn;
            server target-app:8080 max_fails=3 fail_timeout=5s;
            keepalive 64;
        }
        upstream dashboard_backend {
            server dashboard:80;
            keepalive 16;
        }
        # NexusGear static bundle (services/ecommerce, nginx). Only the
        # browser page and its assets come from here; every API call and all
        # load-generator traffic still goes to target_backend.
        upstream storefront_backend {
            server storefront:80;
            keepalive 8;
        }

        server {
            listen 8090;
            location = /healthz {
                access_log off;
                default_type text/plain;
                return 200 "ok\n";
            }
            # Read-only live status for the storefront banner. The dashboard
            # pod's nginx allows GET only and returns 404 for the rest of
            # /api/orchestrator/.
            location = /api/orchestrator/api/target/status {
                proxy_pass http://dashboard_backend;
                proxy_http_version 1.1;
                proxy_set_header Connection "";
                proxy_set_header Host $host;
                proxy_connect_timeout 2s;
                proxy_read_timeout 5s;
            }
            # Always the autoscaled workload: API, health and metrics.
            location ^~ /api/ {
                proxy_pass http://target_backend;
                proxy_http_version 1.1;
                proxy_set_header Connection "";
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_connect_timeout 2s;
                proxy_read_timeout 5s;
            }
            location = /health {
                proxy_pass http://target_backend;
                proxy_http_version 1.1;
                proxy_set_header Connection "";
                proxy_set_header Host $host;
                proxy_connect_timeout 2s;
                proxy_read_timeout 5s;
            }
            location = /metrics {
                proxy_pass http://target_backend;
                proxy_http_version 1.1;
                proxy_set_header Connection "";
                proxy_set_header Host $host;
                proxy_connect_timeout 2s;
                proxy_read_timeout 5s;
            }
            # Built bundle files (hashed names) and the icon: static pod.
            location ^~ /assets/ {
                proxy_pass http://storefront_backend;
                proxy_http_version 1.1;
                proxy_set_header Connection "";
                proxy_set_header Host $host;
                proxy_connect_timeout 2s;
                proxy_read_timeout 5s;
            }
            location = /favicon.svg {
                proxy_pass http://storefront_backend;
                proxy_http_version 1.1;
                proxy_set_header Connection "";
                proxy_set_header Host $host;
            }
            # "/" : a browser (Accept: text/html) gets the NexusGear page from
            # the static pod. Load generators (locust, nasa_replay, curl) send
            # no text/html Accept header and keep hitting target-app, so the
            # NASA replay still exercises the autoscaled pods.
            location / {
                set $page_upstream target_backend;
                if ($http_accept ~* "text/html") {
                    set $page_upstream storefront_backend;
                }
                proxy_pass http://$page_upstream;
                proxy_http_version 1.1;
                proxy_set_header Connection "";
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_connect_timeout 2s;
                proxy_read_timeout 5s;
            }
        }

        server {
            listen 80;
            # The dashboard polls /api/orchestrator/... and its nginx proxies
            # that prefix on. Forward the whole request, including Upgrade,
            # and do not buffer so a stream is not held until it ends.
            location / {
                proxy_pass http://dashboard_backend;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection $connection_upgrade;
                proxy_buffering off;
                proxy_cache off;
                proxy_read_timeout 3600s;
                proxy_send_timeout 3600s;
            }
        }

        server {
            listen 8091;
            location = /stub_status {
                stub_status on;
                access_log off;
                allow 127.0.0.1;
                allow ::1;
                allow 10.0.0.0/8;
                allow 172.16.0.0/12;
                allow 192.168.0.0/16;
                deny all;
            }
            location / {
                return 404;
            }
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: target-app
  namespace: capstone
  labels:
    app: target-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: target-app
  template:
    metadata:
      labels:
        app: target-app
    spec:
      terminationGracePeriodSeconds: 20
      containers:
        - name: target-app
          image: capstone/target-app:latest
          # IfNotPresent so kind/minikube can use a locally loaded image.
          # The AKS deploy scripts overlay imagePullPolicy: Always after the
          # image has been pushed to ACR.
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          # /health is implemented by services/target-app and is not used for
          # traffic. Readiness keeps a pod out of the Service until it can
          # serve, which is the 10-30s startup the forecast lead time covers.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          resources:
            # 50m request lets a 2-vCPU student node schedule the warm-up
            # fleet (requests, not limits, decide scheduling).
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: target-app
  namespace: capstone
spec:
  selector:
    app: target-app
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-lb
  namespace: capstone
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-lb
  template:
    metadata:
      labels:
        app: nginx-lb
    spec:
      terminationGracePeriodSeconds: 20
      containers:
        - name: nginx-lb
          image: nginx:alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8090
            - name: web
              containerPort: 80
            - name: metrics
              containerPort: 8091
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 15
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          resources:
            # Requests stay small so this schedules beside the storefront on
            # a 2 vCPU node. The limit is one core: proxying the replay peak
            # is mostly that core, not the 50m request.
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 192Mi
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
      volumes:
        - name: nginx-config
          configMap:
            name: nginx-lb-config
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-lb
  namespace: capstone
spec:
  type: LoadBalancer
  selector:
    app: nginx-lb
  ports:
    - name: web
      protocol: TCP
      port: 80
      targetPort: web
    - name: http
      protocol: TCP
      port: 8090
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-metrics
  namespace: capstone
spec:
  type: ClusterIP
  selector:
    app: nginx-lb
  ports:
    - name: metrics
      protocol: TCP
      port: 8091
      targetPort: metrics
